<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose Vocab Runner UI</title>
    <link rel="stylesheet" href="./ui-options.css?v=8" />
  </head>
  <body>
    <main class="chooser">
      <p class="eyebrow">Vocab Runner UI Concepts</p>
      <h1>Choose a Frontend Direction</h1>
      <p class="intro">三套 UI 使用同一套题库和游戏逻辑，只改变前端视觉、节奏感和课堂氛围。</p>

      <section class="option-grid" aria-label="UI versions">
        <a class="option-card arcade" href="./index-arcade.html">
          <span class="tag">A</span>
          <h2>Arcade Stadium</h2>
          <p>更像街机跑酷，视觉冲击更强，适合想让学生快速进入游戏状态。</p>
          <strong>Open Version A</strong>
        </a>

        <a class="option-card campus" href="./index-campus.html">
          <span class="tag">B</span>
          <h2>Campus Meet</h2>
          <p>校园运动会风格，更明亮亲和，适合课堂大屏或低年级学生复习。</p>
          <strong>Open Version B</strong>
        </a>

        <a class="option-card lab" href="./index-sprintlab.html">
          <span class="tag">C</span>
          <h2>Sprint Lab · Selected</h2>
          <p>训练面板风格，信息更紧凑，已作为主入口方向；45 秒答题节奏更刺激。</p>
          <strong>Open Version C</strong>
        </a>
      </section>
    </main>
  </body>
</html>
